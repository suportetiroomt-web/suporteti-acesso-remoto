name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build and verify upstream RustDesk
        shell: powershell
        run: ./scripts/build.ps1

      - name: Generate checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash ./artifacts/SuporteTI-AcessoRemoto.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SuporteTI-AcessoRemoto.exe" | Set-Content ./artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuporteTI-AcessoRemoto-unsigned
          path: artifacts/
          if-no-files-found: error
